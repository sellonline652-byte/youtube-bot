name: Scenario drill (simulations only - nothing is sent, nothing is saved)
on:
  schedule:
    - cron: "30 23 * * 6"       # Sunday 05:00 IST, after the fire drill: 2,000 scenarios (owner, 1 Nov 2026)
  workflow_dispatch:
    inputs:
      total: {description: "scenarios (max 5000 - small checks only)", default: "2000"}
      seed: {description: "seed base", default: "7"}
concurrency:
  group: scenario-drill            # own queue: never shares 'video-bot', so it never cancels or delays a live run
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
env:
  BOT_WORK: ${{ github.workspace }}/work
  REPO_KEY: ${{ secrets.REPO_KEY }}
  GH_TOKEN: ${{ github.token }}
jobs:
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 1              # one machine: the 100,000-run drills on 4 machines likely got the old account suspended
      matrix:
        shard: [0]
    steps:
      - name: Wait while a live video run is waiting for a runner
        run: |
          for i in $(seq 1 30); do
            q=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow daily.yml --status queued --json databaseId --jq length)
            [ "$q" = "0" ] && break
            echo "a live run is queued - waiting"; sleep 60
          done
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -q cryptography && python vault/boot.py open
      - run: pip install -q -r requirements.txt
      - name: Scenarios (capped at 5,000)
        run: |
          total=${{ inputs.total || '2000' }}
          [ "$total" -gt 5000 ] 2>/dev/null && total=5000
          python -u bot/scenarios.py "$total" 0 1 ${{ inputs.seed || '7' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: "scenarios-${{ matrix.shard }}", path: "work/scenarios_*.json", retention-days: 7}
